services:
  noxa-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: noxa_bank
      POSTGRES_USER: noxa
      POSTGRES_PASSWORD: noxa_password
    ports:
      - "5433:5432"
    volumes:
      - noxa_postgres_data:/var/lib/postgresql/data
    
  keycloak-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - noxa_keycloak_postgres_data:/var/lib/postgresql/data
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-postgres

volumes:
  noxa_postgres_data:
  noxa_keycloak_postgres_data: